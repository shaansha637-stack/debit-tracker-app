name: DebtTracker
options:
  bundleIdPrefix: com.mine
  deploymentTarget:
    iOS: "17.0"
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.0.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 8.0.0
targets:
  DebtTracker:
    type: application
    platform: iOS
    sources: [DebtTracker]
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: GoogleSignIn
        product: GoogleSignIn
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Kadam
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UIAppFonts: [ProductSans-BoldItalic.ttf]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleURLTypes:
          - CFBundleURLSchemes: [REVERSED_CLIENT_ID_PLACEHOLDER]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mine.debttracker
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
