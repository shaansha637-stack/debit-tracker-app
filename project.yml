name: DebtTracker
options:
  bundleIdPrefix: com.mine
  deploymentTarget:
    iOS: "17.0"
targets:
  DebtTracker:
    type: application
    platform: iOS
    sources: [DebtTracker]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mine.debttracker
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Kadam
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
