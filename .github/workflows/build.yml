name: Build unsigned IPA
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Inject Google URL scheme
        run: |
          test -f DebtTracker/GoogleService-Info.plist || { echo "ERROR: DebtTracker/GoogleService-Info.plist is missing"; exit 1; }
          REV=$(/usr/libexec/PlistBuddy -c "Print :REVERSED_CLIENT_ID" DebtTracker/GoogleService-Info.plist) || { echo "ERROR: REVERSED_CLIENT_ID missing. Enable Google sign-in in Firebase, then re-download the plist."; exit 1; }
          sed -i '' "s/REVERSED_CLIENT_ID_PLACEHOLDER/$REV/" project.yml
      - name: Generate project
        run: xcodegen generate
      - name: Build
        run: |
          xcodebuild -project DebtTracker.xcodeproj -scheme DebtTracker \
            -configuration Release -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package IPA
        run: |
          mkdir Payload
          cp -r build/Build/Products/Release-iphoneos/DebtTracker.app Payload/
          zip -r DebtTracker.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: DebtTracker-unsigned-ipa
          path: DebtTracker.ipa
